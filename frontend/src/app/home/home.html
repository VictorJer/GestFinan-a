<!-- Declara de forma honesta o limite funcional desta entrega pública. -->
<section
  aria-labelledby="home-title"
  class="relative isolate overflow-hidden rounded-finora-panel border border-finora-line bg-finora-surface px-6 py-12 sm:px-12 sm:py-16"
>
  <div
    aria-hidden="true"
    class="absolute -right-16 -top-20 size-64 rounded-full bg-finora-lavender opacity-70 blur-3xl"
  ></div>
  <div class="relative max-w-2xl">
    <p
      class="mb-5 inline-flex rounded-finora-control bg-finora-lavender px-3 py-1.5 text-sm font-semibold text-finora-brand"
    >
      Em preparação
    </p>
    <h1
      id="home-title"
      class="font-finora-display text-3xl font-bold leading-tight tracking-tight sm:text-5xl"
    >
      O Finora está sendo preparado.
    </h1>
    <p class="mt-5 max-w-xl text-base leading-7 text-finora-muted sm:text-lg sm:leading-8">
      Esta página pública apresenta a identidade do Finora. Os cartões e a conexão ficam na área
      protegida; nenhum dado financeiro é carregado nesta página.
    </p>
    <!-- Oferece acesso coerente com a sessão sem prometer recursos financeiros ainda não entregues. -->
    <div class="mt-8">
      @if (isAuthenticated()) {
        <a
          class="inline-flex min-h-11 items-center justify-center rounded-finora-control bg-finora-brand px-5 py-3 font-semibold text-white transition hover:bg-finora-brand/90 focus-visible:outline-3 focus-visible:outline-solid focus-visible:outline-offset-2 focus-visible:outline-finora-brand"
          routerLink="/area"
        >Abrir cartões e conexão</a>
      } @else {
        <a
          class="inline-flex min-h-11 items-center justify-center rounded-finora-control bg-finora-brand px-5 py-3 font-semibold text-white transition hover:bg-finora-brand/90 focus-visible:outline-3 focus-visible:outline-solid focus-visible:outline-offset-2 focus-visible:outline-finora-brand"
          routerLink="/login"
        >Entrar</a>
      }
    </div>
  </div>
</section>
